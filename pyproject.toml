[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tenant-control-plane"
version = "1.0.0"
description = "Tenant provisioning control plane: REST API, transactional outbox and idempotent task-progress consumer over RabbitMQ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pika>=1.3,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7.9",
    "httpx>=0.27",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
control-plane = "control_plane.cli:main"
worker-simulator = "worker_simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane", "src/worker_simulator"]

# ---------------------------------------------------------------- quality gates
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit rules
    "N",            # pep8-naming
    "SIM",          # simplify
    "RUF",
    "PT",           # pytest style
    "C4",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # asserts and non-crypto randomness are fine in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=control_plane --cov=worker_simulator --cov-report=term-missing"
filterwarnings = [
    # third-party deprecation inside fastapi.testclient, not actionable here
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: needs PostgreSQL (TEST_DATABASE_URL)",
    "e2e: needs the full running stack (E2E_API_URL, E2E_RABBITMQ_URL)",
]

[tool.coverage.run]
branch = true
